<!-- Adaptive-icon FOREGROUND. Android masks adaptive icons and may zoom them,
     so the artwork stays inside the inner 66% safe zone and the rest is clear. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#F4F2FF"/>
      <stop offset="100%" stop-color="#D9B8FF"/>
    </linearGradient>
  </defs>

  <!-- bolt scaled to ~58% of the canvas, centred in the safe zone -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <path d="M291 56 L150 286 h78 l-37 170 160 -246 h-84 z"
          fill="url(#bolt)" stroke="#22326f" stroke-width="12" stroke-linejoin="round"/>
    <g fill="#D9B8FF" opacity="0.95">
      <path d="M118 150 l10 27 27 10 -27 10 -10 27 -10 -27 -27 -10 27 -10z"/>
      <circle cx="396" cy="330" r="12"/>
    </g>
  </g>
</svg>
